title: "María Eugenia Fernández Almirón's MSc Data Science Portfolio"
baseurl: "/MyPortfolio"
markdown: kramdown
permalink: pretty

# Explicitly disables the github-pages gem's default fallback to
# jekyll-theme-primer (a gem theme) — this repo builds Editorial
# from its own copied layouts/includes/assets instead.
theme:

exclude:
  - MyPortfolio_website.zip
  - README.md
  - Gemfile
  - Gemfile.lock
  - Markdown format example.md

sass:
  sass_dir: assets/sass
  sourcemap: never
  # Local Jekyll 4 only: hides Dart Sass deprecation notices about Editorial's
  # original (unchanged) Sass. GitHub Pages' older Sass ignores this setting.
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - slash-div
    - elseif
    - if-function
    - new-global
